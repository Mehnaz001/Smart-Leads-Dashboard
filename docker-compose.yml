version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: smartleads-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartleads

  backend:
    build: ./backend
    container_name: smartleads-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/smartleads
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_me}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: smartleads-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
